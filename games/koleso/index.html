<style>
/* Layout: pit-wall timing board on top (one column per driver), full track below, controls under it. Single dark look by choice. Text sizes are in rem, so a larger browser font grows them; nothing clips at large sizes. */
:root{
  --pit:#15171c; --board:#20232b; --line:#343844; --ink:#f2f3f5; --muted:#9aa0ad;
  --p1:#ffc93c; --p2:#3d8bff; --kerb:#e63946;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--pit);color:var(--ink)}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:.9375rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.drv{background:var(--board);border-radius:4px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;min-width:0;border-top:4px solid var(--c)}
.drv.p1{--c:var(--p1)} .drv.p2{--c:var(--p2)}
.drv .pos{grid-row:span 3;font-family:var(--display);font-size:clamp(1.6rem,5vw,2.5rem);color:var(--c);line-height:1;align-self:center}
.drv .nm{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8125rem;color:var(--c);overflow-wrap:anywhere}
.drv .row{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.drv .row b{color:var(--ink);font-weight:600;white-space:nowrap}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1rem,3vw,1.5rem);margin:0;letter-spacing:.02em;text-wrap:balance}
.clock{font-family:var(--display);font-size:clamp(.875rem,2.4vw,1.125rem);color:var(--muted);font-variant-numeric:tabular-nums}
/* Canvas and overlay share one grid cell, so a tall start screen grows the box instead of clipping. */
.stage{display:grid;width:min(100%,calc((100svh - 200px) * 1.6));min-width:min(100%,320px);margin-inline:auto;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px var(--line);background:var(--pit)}
.stage>*{grid-area:1/1}
canvas{display:block;width:100%;aspect-ratio:8/5;align-self:center}
.overlay{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(21,23,28,.8);text-align:center;padding:16px;min-width:0}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(1.375rem,5vw,2.625rem);margin:0;text-wrap:balance}
.overlay p{margin:0;color:var(--muted);max-width:52ch;font-variant-numeric:tabular-nums}
.laps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.laps button{font-family:var(--body);font-weight:600;font-size:.875rem;color:var(--ink);background:var(--board);border:2px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer}
.laps button[aria-pressed="true"]{border-color:var(--p1);color:var(--p1)}
button.go{font-family:var(--display);font-size:1.125rem;color:var(--pit);background:var(--p1);border:0;border-radius:4px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.legend div{background:var(--board);border-radius:4px;padding:10px 14px;min-width:0}
.legend b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.legend .p1 b{color:var(--p1)} .legend .p2 b{color:var(--p2)}
kbd{font-family:var(--body);font-size:.75rem;background:var(--line);border-radius:3px;padding:1px 6px;color:var(--ink)}
.rules{color:var(--muted);font-size:.8125rem;margin:0;max-width:65ch}
.pads{display:none;grid-template-columns:1fr 1fr;gap:12px;justify-items:center}
.pad{--size:clamp(110px,36vw,160px);position:relative;width:var(--size);height:var(--size);border-radius:50%;border:3px solid var(--c);background:var(--board);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad.p1{--c:var(--p1)} .pad.p2{--c:var(--p2)}
.knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;background:var(--c);opacity:.85;pointer-events:none;transform:translate(var(--x,0px),var(--y,0px))}
@media (pointer:coarse){
  .pads{display:grid}
  .legend{display:none}
  .stage{-webkit-user-select:none;user-select:none}
}
@media (max-width:600px){.board{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;grid-row:1}.legend{grid-template-columns:1fr}}
/* Phone or tablet held sideways: one joystick on each side of the track, for two kids. */
/* Full screen: the track takes all the height left under the scoreboard. */
.fs body{padding-block:8px}
.fs .wrap{max-width:none;height:calc(100svh - 16px)}
.fs .rules{display:none}
.fs .stage{flex:1;min-height:0;width:100%}
.fs canvas{width:100%;height:100%;aspect-ratio:auto;object-fit:contain;min-height:0}
@media (pointer:coarse) and (orientation:landscape){
  body{padding-block:8px}
  .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "board board board" "p1 stage p2" "rules rules rules";gap:8px 12px;align-items:center;max-width:none}
  .top{grid-area:top} .board{grid-area:board} .rules{grid-area:rules}
  .board{grid-template-columns:1fr auto 1fr}.mid{grid-column:auto;grid-row:auto}
  .drv{padding:4px 10px}.drv .pos{font-size:1.5rem}
  .stage{grid-area:stage;justify-self:center;width:min(100%,calc((100svh - 130px) * 1.6))}
  .pads{display:contents}
  .pad{--size:min(150px,40svh,22vw)}
  .fs .wrap{height:auto}
  .fs .stage{width:min(100%,calc((100svh - 150px) * 1.6))}
  .fs canvas{height:auto;aspect-ratio:8/5}
  .pad.p1{grid-area:p1} .pad.p2{grid-area:p2}
}
</style>

  <p class="rules" data-i18n="rules">На траві машина сильно гальмує. Зрізати через газон не вийде: коло рахується тільки по трасі. Машини штовхаються, тож можна виштовхнути суперника.</p>

    language:'Мова',fullscreen:'На весь екран',exitFullscreen:'Вийти з повного екрана',back:'← Усі ігри',name:'Гонка Колесо',track:'Траса для двох гонщиків',

    rules:'На траве машина сильно тормозит. Срезать через газон не выйдет: круг засчитывается только по трассе. Машины толкаются, так что можно вытолкнуть соперника.'
  }
};
const W=960,H=600,HW=44,SEG=16;
const CTRL=[[160,480],[480,520],[800,480],[880,340],[820,200],[680,170],[600,260],[480,300],[380,200],[260,90],[130,140],[90,300]];
const path=[];
for(let i=0;i<CTRL.length;i++){
  const n=CTRL.length,p0=CTRL[(i-1+n)%n],p1=CTRL[i],p2=CTRL[(i+1)%n],p3=CTRL[(i+2)%n];
  for(let s=0;s<SEG;s++){
    const t=s/SEG,t2=t*t,t3=t2*t;
    const f=j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);
    path.push([f(0),f(1)]);
  }
}
const N=path.length;

const cv=document.getElementById('track'),ctx=cv.getContext('2d');
const layer=document.createElement('canvas'),lctx=layer.getContext('2d');
let dpr=1;
function fit(){dpr=Math.min(2,devicePixelRatio||1);cv.width=layer.width=W*dpr;cv.height=layer.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);lctx.setTransform(dpr,0,0,dpr,0,0);paintTrack()}

function tracePath(c){c.beginPath();c.moveTo(path[0][0],path[0][1]);for(let i=1;i<N;i++)c.lineTo(path[i][0],path[i][1]);c.closePath()}
function paintTrack(){
  const c=lctx;
  for(let x=0;x<W;x+=48){c.fillStyle=(x/48)%2?'#24552f':'#1f4d2b';c.fillRect(x,0,48,H)}
  c.lineJoin='round';
  tracePath(c);c.lineWidth=HW*2+12;c.strokeStyle='#e63946';c.setLineDash([]);c.stroke();
  tracePath(c);c.strokeStyle='#f2f3f5';c.setLineDash([16,16]);c.stroke();
  tracePath(c);c.lineWidth=HW*2;c.strokeStyle='#2c2f37';c.setLineDash([]);c.stroke();
  tracePath(c);c.lineWidth=2;c.strokeStyle='rgba(242,243,245,.35)';c.setLineDash([20,22]);c.stroke();
  c.setLineDash([]);
  // checkered finish line across the road at path[0]
  const a=path[0],b=path[1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  const sq=HW/4;
  for(let r=0;r<2;r++)for(let k=0;k<8;k++){
    const off=-HW+k*sq,along=r*sq-sq;
    c.fillStyle=(r+k)%2?'#15171c':'#f2f3f5';
    c.save();c.translate(a[0]+nx*off+ux*along,a[1]+ny*off+uy*along);c.rotate(Math.atan2(uy,ux));c.fillRect(0,0,sq,sq);c.restore();
  }
  c.font='12px "Exo 2", sans-serif';c.fillStyle='rgba(242,243,245,.5)';c.textAlign='center';
  c.fillText(I18N.t('startFinish'),a[0]-10,a[1]+HW+24);
}

function nearest(x,y){
  let best=1e12,bi=0;
  for(let i=0;i<N;i++){
    const a=path[i],b=path[(i+1)%N],dx=b[0]-a[0],dy=b[1]-a[1];
    let t=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));
    const d=(x-a[0]-dx*t)**2+(y-a[1]-dy*t)**2;
    if(d<best){best=d;bi=i}
  }
  return {i:bi,d:Math.sqrt(best)};
}

const keys=new Set(),STICKS=[{x:0,y:0},{x:0,y:0}];
let cars=[],marks=[],state='intro',stateT=0,raceTime=0,LAPS=3,winner=-1,MODE='simple';
const DRV=[
  {name:'p1',c:'#ffc93c',k:{u:'KeyW',d:'KeyS',l:'KeyA',r:'KeyD'},side:-1},
  {name:'p2',c:'#3d8bff',k:{u:'ArrowUp',d:'ArrowDown',l:'ArrowLeft',r:'ArrowRight'},side:1}
];
function placeCars(){
  const si=N-4,p=path[si],q=path[si+1],a=Math.atan2(q[1]-p[1],q[0]-p[0]);
  cars=DRV.map((d,i)=>({...d,stick:STICKS[i],x:p[0]-Math.sin(a)*20*d.side,y:p[1]+Math.cos(a)*20*d.side,a,v:0,prog:-4,last:si,laps:0,lapStart:0,best:null,done:false,t:null}));
}
function start(){
  placeCars();marks=[];raceTime=0;winner=-1;
  overlay.hidden=true;state='count';stateT=3000;
}

function update(dt){
  const k=dt/16.67;
  if(state==='count'){stateT-=dt;if(stateT<=0){state='race';stateT=700}return}
  if(state!=='race')return;
  raceTime+=dt;if(stateT>0)stateT-=dt;
  for(const c of cars){
    const n=nearest(c.x,c.y),road=n.d<HW;
    const a0=c.a,L=keys.has(c.k.l),Rt=keys.has(c.k.r),U=keys.has(c.k.u),D=keys.has(c.k.d);
    const s=c.stick,sm=Math.hypot(s.x,s.y);
    let up=false,dn=false,st=0;
    if(MODE==='simple'){
      // screen-relative: the car turns toward the pressed direction and drives there
      let ix=(Rt?1:0)-(L?1:0),iy=(D?1:0)-(U?1:0),push=true;
      if(sm>.2){ix=s.x;iy=s.y;push=sm>.45}
      if(ix||iy){
        let diff=Math.atan2(iy,ix)-c.a;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
        c.a+=Math.max(-.09*k,Math.min(.09*k,diff));
        if(Math.abs(diff)<1.6)up=push;else dn=c.v>1;
      }
    }else{
      up=U||s.y<-.35;dn=D||s.y>.35;
      st=(Rt?1:0)-(L?1:0);
      if(!st&&Math.abs(s.x)>.2)st=s.x;
    }
    if(up)c.v+=.11*k;
    if(dn)c.v-=(c.v>0?.22:.07)*k;
    const max=road?5.4:2.2;
    if(c.v>max)c.v=Math.max(max,c.v-.3*k);
    if(c.v<-1.6)c.v=-1.6;
    c.v*=Math.pow(road?.99:.965,k);
    if(!up&&!dn&&Math.abs(c.v)<.03)c.v=0;
    if(st){const grip=Math.min(1,.35+Math.abs(c.v)/2);c.a+=st*.055*grip*(c.v<-.1?-1:1)*k}
    c.x+=Math.cos(c.a)*c.v*k;c.y+=Math.sin(c.a)*c.v*k;
    if(c.x<12||c.x>W-12){c.x=Math.max(12,Math.min(W-12,c.x));c.v*=-.3}
    if(c.y<12||c.y>H-12){c.y=Math.max(12,Math.min(H-12,c.y));c.v*=-.3}
    if(Math.abs(c.a-a0)>.035*k&&c.v>4&&road){marks.push({x:c.x,y:c.y,a:c.a});if(marks.length>700)marks.shift()}
    let d=n.i-c.last;if(d>N/2)d-=N;if(d<-N/2)d+=N;
    if(Math.abs(d)<=N/6){c.prog+=d;c.last=n.i}
    const done=Math.floor(c.prog/N);
    if(done>c.laps){
      const lt=raceTime-c.lapStart;c.lapStart=raceTime;c.laps=done;
      if(c.best===null||lt<c.best)c.best=lt;
      if(c.laps>=LAPS&&!c.done){c.done=true;c.t=raceTime;if(winner<0)winner=cars.indexOf(c)}
    }
  }
  const A=cars[0],B=cars[1],dx=B.x-A.x,dy=B.y-A.y,dist=Math.hypot(dx,dy);
  if(dist<24&&dist>0){
    const push=(24-dist)/2,ux=dx/dist,uy=dy/dist;
    A.x-=ux*push;A.y-=uy*push;B.x+=ux*push;B.y+=uy*push;A.v*=.9;B.v*=.9;
  }
  if(winner>=0)finish();
}
function finish(){
  state='done';
  overlayText();overlay.hidden=false;goBtn.focus();
}
function overlayText(){
  const t=I18N.t;
  if(state!=='done'){
    ovTitle.textContent=t('name');ovTitle.style.color='';ovText.textContent=t('intro');goBtn.textContent=t('start');
    return;
  }
  const w=cars[winner],o=cars[1-winner];
  ovTitle.textContent=t(w.name)+' '+t('wins');ovTitle.style.color=w.c;
  const gap=o.prog>0?' '+t('behind').replace('{n}',Math.max(0,Math.round((LAPS*N-o.prog)/N*100)/100).toFixed(2)):'';
  ovText.textContent=t('result').replace('{time}',fmt(w.t)).replace('{w}',t(w.name)+' '+fmt(w.best)).replace('{o}',t(o.name)+' '+fmt(o.best))+gap;
  goBtn.textContent=t('again');
}

function fmt(ms){if(ms===null)return '—';const s=ms/1000,m=Math.floor(s/60),r=(s%60).toFixed(2).padStart(5,'0');return m+':'+r}

function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-14,-7,30,16);
  ctx.fillStyle='#0d0e11';
  ctx.fillRect(-12,-10,8,4);ctx.fillRect(-12,6,8,4);ctx.fillRect(6,-10,8,4);ctx.fillRect(6,6,8,4);
  ctx.fillStyle=c.c;ctx.beginPath();ctx.roundRect(-15,-8,30,16,5);ctx.fill();
  ctx.fillStyle='#15171c';ctx.fillRect(2,-6,6,12);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(-13,-1.5,12,3);
  ctx.fillStyle='#fff6c8';ctx.fillRect(13,-6,2,3);ctx.fillRect(13,3,2,3);
  ctx.restore();
}
function draw(){
  ctx.drawImage(layer,0,0,W,H);
  ctx.fillStyle='rgba(10,10,12,.28)';
  for(const m of marks){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);ctx.fillRect(-12,-9,4,3);ctx.fillRect(-12,6,4,3);ctx.restore()}
  for(const c of cars)drawCar(c);
  let txt='';
  if(state==='count')txt=String(Math.ceil(stateT/1000));
  else if(state==='race'&&stateT>0)txt=I18N.t('go');
  if(txt){
    ctx.font='72px "Russo One", "Arial Black", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=8;ctx.strokeStyle='#15171c';ctx.strokeText(txt,W/2,H/2-20);
    ctx.fillStyle=state==='count'?'#e63946':'#ffc93c';ctx.fillText(txt,W/2,H/2-20);
  }
}

const $=id=>document.getElementById(id);
const overlay=$('overlay'),ovTitle=$('ovTitle'),ovText=$('ovText'),goBtn=$('goBtn');
function hud(){
  $('clock').textContent=fmt(raceTime);
  cars.forEach((c,i)=>{
    $('lap'+(i+1)).textContent=Math.min(LAPS,Math.max(1,c.laps+1))+'/'+LAPS;
    $('best'+(i+1)).textContent=fmt(c.best);
  });
  const lead=cars[0].prog>=cars[1].prog?0:1;
  $('pos1').textContent=lead===0?'1':'2';$('pos2').textContent=lead===1?'1':'2';
}

document.querySelectorAll('#lapsPick button').forEach(b=>b.addEventListener('click',()=>{
  LAPS=+b.dataset.l;
  document.querySelectorAll('#lapsPick button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  hud();
}));
const KEYCAPS=[['W','S','A','D'],['↑','↓','←','→']];
function legend(){
  const t=I18N.t,kb=x=>'<kbd>'+x+'</kbd>';
  KEYCAPS.forEach(([u,d,l,r],i)=>{
    $('leg'+(i+1)).innerHTML=MODE==='simple'
      ?kb(u)+' '+t('up')+', '+kb(d)+' '+t('down')+', '+kb(l)+' '+t('left')+', '+kb(r)+' '+t('right')+'. '+t('simpleTail')
      :kb(u)+' '+t('gas')+', '+kb(d)+' '+t('brake')+', '+kb(l)+' '+kb(r)+' '+t('steer');
  });
}
document.querySelectorAll('#modePick button').forEach(b=>b.addEventListener('click',()=>{
  MODE=b.dataset.m;
  document.querySelectorAll('#modePick button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  legend();
}));
goBtn.addEventListener('click',start);

const GAME_KEYS=new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space']);
addEventListener('keydown',e=>{
  if(GAME_KEYS.has(e.code))e.preventDefault();
  if(e.code==='KeyF'&&!e.repeat&&fsOK&&!e.target.closest?.('select')){toggleFs();return}
  if((state==='intro'||state==='done')&&(e.code==='Space'||e.code==='Enter')&&!e.repeat&&document.activeElement?.closest?.('.laps')==null){e.preventDefault();start();return}
  keys.add(e.code);
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());

// Touch joysticks: x and y run from -1 to 1, screen-relative like the arrow keys.
document.querySelectorAll('.pad').forEach((pad,i)=>{
  const s=STICKS[i],knob=pad.querySelector('.knob');
  let id=null;
  const move=e=>{
    const r=pad.getBoundingClientRect(),reach=r.width*.36;
    let x=(e.clientX-r.left-r.width/2)/reach,y=(e.clientY-r.top-r.height/2)/reach;
    const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
    s.x=x;s.y=y;knob.style.setProperty('--x',x*reach+'px');knob.style.setProperty('--y',y*reach+'px');
  };
  const end=e=>{if(e.pointerId!==id)return;id=null;s.x=s.y=0;knob.style.setProperty('--x','0px');knob.style.setProperty('--y','0px')};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;pad.setPointerCapture(id);move(e)});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pad.addEventListener(ev,end));
  pad.addEventListener('contextmenu',e=>e.preventDefault());
});

fit();addEventListener('resize',fit);
if(document.fonts)document.fonts.ready.then(paintTrack);
placeCars();hud();
I18N.init(TEXTS,()=>{legend();overlayText();paintTrack()});

// Full screen covers the whole page so touch joysticks stay usable. iPhone Safari has no API for it, so the button hides there.
const root=document.documentElement,fsBtn=$('fsBtn'),fsLabel=fsBtn.querySelector('span');
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFs(){
  if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);
}
function onFs(){
  const on=!!fsEl();
  root.classList.toggle('fs',on);
  fsLabel.dataset.i18n=on?'exitFullscreen':'fullscreen';fsLabel.textContent=I18N.t(fsLabel.dataset.i18n);
  fsBtn.blur();
}
if(fsOK){
  fsBtn.hidden=false;
  fsBtn.addEventListener('click',toggleFs);
  document.addEventListener('fullscreenchange',onFs);
  document.addEventListener('webkitfullscreenchange',onFs);
}
let last=performance.now();
function loop(t){const dt=Math.min(50,t-last);last=t;update(dt);draw();hud();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>

</body></html>
